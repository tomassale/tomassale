<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    Marca de la pestaña: campo pleno con el degradado del banner (cian
    eléctrico -> azul eléctrico) y la T recortada en azul noche. Campo de
    color en vez de acento sobre oscuro, para que se lea a 16 px y no se
    pierda contra pestañas claras ni oscuras. El travesaño es asimétrico
    a propósito.
  -->
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22e4ff"/>
      <stop offset="1" stop-color="#3d5afe"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#brand)"/>
  <path d="M12 15h42v10H36v24H26V25H12z" fill="#050b1e"/>
</svg>
