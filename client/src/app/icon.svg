<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 395 224">
  <!--
    Marca de la pestaña: el `</>` de siempre, en vector y sin fondo — el
    degradado va sobre el trazo, así que el ícono se recorta contra
    pestañas claras y oscuras por igual. Las coordenadas y los colores
    salen del PNG original (395x224, #8eccff -> #dc8cfc de izquierda a
    derecha); el trazo es de 44 con puntas redondeadas.
  -->
  <defs>
    <linearGradient id="brand" x1="32" y1="0" x2="362" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8eccff"/>
      <stop offset="1" stop-color="#dc8cfc"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#brand)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round">
    <path d="M99 65 54 112 99 160"/>
    <path d="M165 180 229 45"/>
    <path d="M296 65 341 112 296 160"/>
  </g>
</svg>
